version: 2.1

orbs:
  android: circleci/android@3.2.0

jobs:
  build-and-unit-test:
    executor:
      name: android/android_docker
      resource_class: large
      tag: default
    steps:
      - checkout
      - android/restore_gradle_cache
      - run:
          name: Restore secret files
          command: |
            echo $KEYSTORE_PROPERTIES | base64 -d > keystore.properties
            echo $KEYSTORE_FILE | base64 -d > app/artemis-agent-keystore.jks
            echo $GOOGLE_SERVICES | base64 -d > app/google-services.json
      - run:
          name: Build and test
          command: ./gradlew build koverXmlReport
      - store_test_results:
          path: app/build/test-results
      - android/save_gradle_cacle
      - store_artifacts:
          path: app/build/reports
          destination: reports

  run-instrumented-tests:
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    steps:
      - checkout
      - run:
          name: Restore secret files
          command: |
            echo $KEYSTORE_PROPERTIES | base64 -d > keystore.properties
            echo $GOOGLE_SERVICES | base64 -d > app/google-services.json
      - android/start_emulator_and_run_tests:
          system_image: system-images;android-36;google_apis_playstore;x86_64
          test_command: ./gradlew connectedCheck
      - store_test_results:
          path: app/build/outputs/androidTest-results/connected
      - store_artifacts:
          path: app/build/outputs/androidTest-results/connected
          destination: instrumented-tests

workflows:
  build-test-deploy:
    jobs:
      - build-and-unit-test
      - run-instrumented-tests
