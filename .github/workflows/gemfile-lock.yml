name: Update Gemfile.lock

on:
  push:
    branches: [ "main" ]
    paths:
      - .tool-versions
      - Gemfile
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        bundler-cache: true

    - name: Update lockfile
      run: |
        rm Gemfile.lock
        bundle config set frozen false
        bundle update --all

    - name: Create Pull Request
      id: create
      uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
      with:
        add-paths: Gemfile.lock
        commit-message: "Update Gemfile.lock"
        title: "Update Gemfile.lock"

    - name: Enable Auto Merge
      if: ${{ steps.create.outputs.pull-request-number }}
      run: gh pr merge ${{ steps.create.outputs.pull-request-number }} -m --auto
      env:
        GH_TOKEN: ${{ github.token }}
