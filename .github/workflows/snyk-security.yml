# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up Snyk to analyze the full Snyk platform (Snyk Open Source, Snyk Code,
# Snyk Container and Snyk Infrastructure as Code)
# The setup installs the Snyk CLI - for more details on the possible commands
# check https://docs.snyk.io/snyk-cli/cli-reference
# The results of Snyk Code are then uploaded to GitHub Security Code Scanning
#
# In order to use the Snyk Action you will need to have a Snyk API token.
# More details in https://github.com/snyk/actions#getting-your-snyk-token
# or you can signup for free at https://snyk.io/login
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Security

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: read # for actions/checkout to fetch code
  security-events: write # for github/codeql-action/upload-sarif to upload SARIF results

jobs:
  snyk-gradle:
    name: Gradle (${{ matrix.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - .
          - build-logic
          - app
          - app/konsist
          - IAN
          - IAN/annotations
          - IAN/annotations/konsist
          - IAN/enums
          - IAN/enums/konsist
          - IAN/grid
          - IAN/listener
          - IAN/listener/konsist
          - IAN/packets
          - IAN/packets/konsist
          - IAN/processor
          - IAN/udp
          - IAN/udp/konsist
          - IAN/util
          - IAN/util/konsist
          - IAN/vesseldata
          - IAN/vesseldata/konsist
          - IAN/world
          - IAN/world/konsist
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Snyk category
        id: get-category
        if: ${{ matrix.path != '.' }}
        uses: mad9000/actions-find-and-replace-string@789e104bfa5a1e90579e74de187e696450611aa2 # 6
        with:
          source: ${{ matrix.path }}
          find: '/'
          replace: '-'

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: --file=${{ matrix.path }}/build.gradle.kts --sarif-file-output=snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Monitor
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: monitor
          args: --file=${{ matrix.path }}/build.gradle.kts
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() # Ensure SARIF file upload
        with:
          sarif_file: snyk.sarif
          category: snyk-${{ steps.get-category.outputs.value || 'root' }}


  snyk-gemfile:
    name: Gemfile
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/ruby@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: --file=Gemfile --project=Gemfile --sarif-file-output=snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Monitor
        uses: snyk/actions/ruby@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: monitor
          args: --file=Gemfile --project=Gemfile
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Push the Snyk Code results into GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() # Ensure SARIF file upload
        with:
          sarif_file: snyk.sarif
          category: snyk-gemfile
