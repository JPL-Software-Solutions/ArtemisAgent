version: 2.1

orbs:
  android: circleci/android@3.2.0

jobs:
  build-and-unit-test:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: large
    steps:
      - checkout
      - run:
          name: Calculate cache key
          command: |-
            find . -name 'pom.xml' -o -name 'gradlew*' -o -name '*.gradle*' | \
                    sort | xargs cat > /tmp/CIRCLECI_CACHE_KEY
      - restore_cache:
          name: Restore cache
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
      - run:
          name: Restore secret files
          command: |
            echo $KEYSTORE_PROPERTIES | base64 -d > keystore.properties
            echo $KEYSTORE_FILE | base64 -d > app/artemis-agent-keystore.jks
            echo $GOOGLE_SERVICES | base64 -d > app/google-services.json
      - run:
          name: Build and test
          command: ./gradlew build koverXmlReport
      - store_test_results:
          path: app/build/test-results
      - save_cache:
          name: Store Gradle caches
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
          paths:
            - ~/.gradle/caches
      - store_artifacts:
          path: app/build/reports
          destination: reports

  run-instrumented-tests:
    executor:
      name: android/android-machine
      resource-class: xlarge
      tag: default
    steps:
      - checkout
      - run:
          name: Restore secret files
          command: |
            echo $KEYSTORE_PROPERTIES | base64 -d > keystore.properties
            echo $GOOGLE_SERVICES | base64 -d > app/google-services.json
      - android/run_tests:
          system_image: system-images;android-36;google_apis_playstore;x86_64
          test_command: ./gradlew connectedCheck
      - store_test_results:
          path: app/build/outputs/androidTest-results/connected
      - store_artifacts:
          path: app/build/outputs/androidTest-results/connected
          destination: instrumented-tests

workflows:
  build-test-deploy:
    jobs:
      - build-and-unit-test
      - run-instrumented-tests
